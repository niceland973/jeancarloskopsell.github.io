<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space Defender — Jogo 2D</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070b1d;color:#eef2ff;font-family:system-ui,Arial;display:flex;justify-content:center;align-items:center;padding:18px}.wrap{width:min(100%,720px);text-align:center}h1{margin:0 0 6px;letter-spacing:2px;color:#7df9ff}p{margin:6px 0 14px;color:#b7c2e5}.hud{display:flex;justify-content:space-between;gap:12px;margin:10px 0;font-weight:700}.screen{position:relative;border:2px solid #26366e;border-radius:14px;overflow:hidden;box-shadow:0 0 32px #192b65;background:#080d26}canvas{display:block;width:100%;height:auto;touch-action:none}.controls{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}button{border:1px solid #4d64bd;background:#182550;color:white;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer;touch-action:manipulation}button:active{background:#304a91;transform:scale(.98)}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#05091bd9;padding:20px}.overlay h2{color:#7df9ff;font-size:clamp(25px,5vw,42px);margin:0 0 8px}.hidden{display:none}.hint{font-size:13px;color:#9eaddd}
</style>
</head>
<body><main class="wrap"><h1>SPACE DEFENDER</h1><p>Defenda a galáxia e sobreviva às ondas inimigas.</p>
<div class="hud"><span>⭐ Pontos: <b id="score">0</b></span><span>❤️ Vidas: <b id="lives">3</b></span><span>🏆 Recorde: <b id="best">0</b></span></div>
<div class="screen"><canvas id="game" width="640" height="480" aria-label="Jogo espacial 2D"></canvas><div class="overlay" id="overlay"><h2 id="title">SPACE DEFENDER</h2><p id="message">Destrua os inimigos antes que cheguem até você!</p><button id="start">▶ Jogar</button></div></div>
<div class="controls"><button id="left" aria-label="Mover para esquerda">⬅️</button><button id="fire">🚀 Atirar</button><button id="right" aria-label="Mover para direita">➡️</button><button id="restart">↻ Reiniciar</button></div><p class="hint">Teclado: ← → para mover, Espaço para atirar. No celular, use os botões.</p></main>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),titleEl=document.getElementById('title'),msgEl=document.getElementById('message');
let player,shots,enemies,particles,score,lives,running,keys={},lastSpawn,frame,best=Number(localStorage.getItem('spaceDefenderBest')||0);bestEl.textContent=best;
const stars=Array.from({length:90},()=>({x:Math.random()*640,y:Math.random()*480,r:Math.random()*1.7+.3,s:Math.random()*1.1+.3}));
function reset(){player={x:320,y:425,w:38,h:28,speed:5,cd:0,inv:0};shots=[];enemies=[];particles=[];score=0;lives=3;frame=0;lastSpawn=0;running=true;keys={};scoreEl.textContent=score;livesEl.textContent=lives;overlay.classList.add('hidden');}
function end(){running=false;overlay.classList.remove('hidden');titleEl.textContent='FIM DE JOGO';msgEl.textContent='Você fez '+score+' pontos. Tente superar seu recorde!';document.getElementById('start').textContent='Jogar novamente';}
function shoot(){if(running&&player.cd<=0){shots.push({x:player.x,y:player.y-18,vy:-8});player.cd=12}}
function spawn(){let x=24+Math.random()*592;enemies.push({x,y:-24,w:28+Math.random()*12,h:24,hp:1,vy:1.2+Math.min(score/180,2.6),vx:(Math.random()-.5)*1.2});}
function burst(x,y,color){for(let i=0;i<9;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:22,color});}
function hit(a,b){return a.x-a.w/2<b.x+b.w/2&&a.x+a.w/2>b.x-b.w/2&&a.y-a.h/2<b.y+b.h/2&&a.y+a.h/2>b.y-b.h/2}
function drawShip(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#7df9ff';ctx.beginPath();ctx.moveTo(0,-19);ctx.lineTo(17,12);ctx.lineTo(5,8);ctx.lineTo(0,14);ctx.lineTo(-5,8);ctx.lineTo(-17,12);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-3,-3,6,9);ctx.fillStyle='#ffb347';ctx.beginPath();ctx.moveTo(-5,11);ctx.lineTo(0,22+Math.random()*5);ctx.lineTo(5,11);ctx.fill();ctx.restore()}
function drawEnemy(e){ctx.fillStyle='#ff5378';ctx.beginPath();ctx.moveTo(e.x,e.y-13);ctx.lineTo(e.x+17,e.y-3);ctx.lineTo(e.x+12,e.y+11);ctx.lineTo(e.x+5,e.y+6);ctx.lineTo(e.x,e.y+13);ctx.lineTo(e.x-5,e.y+6);ctx.lineTo(e.x-12,e.y+11);ctx.lineTo(e.x-17,e.y-3);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(e.x-8,e.y-3,5,4);ctx.fillRect(e.x+4,e.y-3,5,4)}
function draw(){ctx.fillStyle='#080d26';ctx.fillRect(0,0,640,480);for(const s of stars){ctx.fillStyle='rgba(200,220,255,'+(.35+Math.sin(frame*.04+s.x)*.3)+')';ctx.fillRect(s.x,(s.y+frame*s.s)%480,s.r,s.r)}for(const sh of shots){ctx.fillStyle='#7df9ff';ctx.shadowColor='#7df9ff';ctx.shadowBlur=12;ctx.fillRect(sh.x-2,sh.y-9,4,16);ctx.shadowBlur=0}enemies.forEach(drawEnemy);if(player&&(player.inv<=0||Math.floor(frame/5)%2===0))drawShip(player.x,player.y);for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/22);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1}if(!running&&score===0){ctx.fillStyle='#7df9ff';ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.fillText('PRONTO PARA A MISSÃO?',320,330)}}
function update(){if(!running)return;frame++;if(keys.ArrowLeft||keys.a)player.x-=player.speed;if(keys.ArrowRight||keys.d)player.x+=player.speed;player.x=Math.max(20,Math.min(620,player.x));if(keys[' ']||keys.Space)shoot();if(player.cd>0)player.cd--;if(player.inv>0)player.inv--;if(frame-lastSpawn>Math.max(22,65-score/12)){spawn();lastSpawn=frame}for(const s of shots)s.y+=s.vy;shots=shots.filter(s=>s.y>-20);for(const e of enemies){e.y+=e.vy;e.x+=e.vx;if(e.x<18||e.x>622)e.vx*=-1;if(e.y>470){e.y=-30;e.x=20+Math.random()*600;lives--;livesEl.textContent=lives;player.inv=45;if(lives<=0)end()}}for(let i=enemies.length-1;i>=0;i--){let e=enemies[i],destroyed=false;for(let j=shots.length-1;j>=0;j--){if(Math.abs(shots[j].x-e.x)<23&&Math.abs(shots[j].y-e.y)<22){shots.splice(j,1);destroyed=true;break}}if(destroyed){burst(e.x,e.y,'#ff5378');enemies.splice(i,1);score+=10;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('spaceDefenderBest',best)}}else if(player.inv<=0&&Math.abs(player.x-e.x)<30&&Math.abs(player.y-e.y)<30){enemies.splice(i,1);burst(e.x,e.y,'#7df9ff');lives--;livesEl.textContent=lives;player.inv=70;if(lives<=0)end()}}for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.life--}particles=particles.filter(p=>p.life>0);draw();if(running)requestAnimationFrame(update)}
function start(){reset();draw();requestAnimationFrame(update)}
document.getElementById('start').addEventListener('click',start);document.getElementById('restart').addEventListener('click',start);
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','Space'].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key===' '||e.key==='Space')shoot();if(!running&&e.key==='Enter')start()});
window.addEventListener('keyup',e=>keys[e.key]=false);
function hold(id,key){const el=document.getElementById(id);const down=e=>{e.preventDefault();keys[key]=true};const up=e=>{e.preventDefault();keys[key]=false};el.addEventListener('pointerdown',down);['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,up))}
hold('left','ArrowLeft');hold('right','ArrowRight');document.getElementById('fire').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});draw();
</script></body></html>
