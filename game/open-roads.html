<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Open Roads — Endless Drive</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9cc9e5;font-family:Inter,system-ui,Arial,sans-serif}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 8px #14202b99}.brand{position:absolute;top:20px;left:22px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;opacity:.85}.brand b{display:block;font-size:24px;letter-spacing:.04em;margin-top:3px}.stats{position:absolute;top:20px;right:22px;text-align:right;background:#0d18264f;padding:12px 16px;border:1px solid #ffffff40;border-radius:14px;backdrop-filter:blur(8px)}.speed{font-size:32px;font-weight:750;line-height:1}.unit{font-size:11px;letter-spacing:.15em;opacity:.8}.hint{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);padding:10px 15px;border-radius:30px;background:#0d18265c;border:1px solid #ffffff3d;white-space:nowrap;font-size:12px;letter-spacing:.04em}.actions{position:absolute;right:18px;bottom:18px;display:flex;gap:10px;pointer-events:auto}.actions button,.mobile button{border:1px solid #ffffff70;background:#102238a6;color:white;border-radius:14px;padding:12px 15px;font-weight:650;backdrop-filter:blur(8px)}.mobile{position:absolute;left:16px;bottom:18px;display:none;gap:10px;pointer-events:auto}.mobile button{width:58px;height:58px;font-size:22px;touch-action:none}.mobile .gas{width:88px;font-size:12px;letter-spacing:.05em}@media(max-width:700px){.mobile{display:flex}.hint{bottom:92px;font-size:10px}.stats{top:14px;right:14px}.brand{top:15px;left:14px}.brand b{font-size:19px}.actions{top:100px;bottom:auto;right:12px}.actions button{font-size:11px;padding:9px 11px}}
</style>
</head>
<body>
<div id="hud">
 <div class="brand">A scenic driving experiment<b>OPEN ROADS</b></div>
 <div class="stats"><div class="speed"><span id="speed">72</span> <span style="font-size:13px">km/h</span></div><div class="unit">ENDLESS CRUISE</div><div style="font-size:11px;margin-top:7px;opacity:.85">Distância: <span id="distance">0.0</span> km</div></div>
 <div class="hint" id="hint">WASD / setas para dirigir · Espaço para frear · R para reiniciar</div>
 <div class="mobile"><button id="left">←</button><button id="right">→</button><button id="gas" class="gas">ACELERAR</button></div>
 <div class="actions"><button id="change">Trocar carro</button><button id="pause">Pausar</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=> {
const speedEl=document.getElementById('speed'),distEl=document.getElementById('distance'),hint=document.getElementById('hint');
if(!window.THREE){hint.textContent='Não foi possível carregar o motor 3D. Verifique a conexão e recarregue.';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9cc9e5);scene.fog=new THREE.Fog(0x9cc9e5,90,330);
const camera=new THREE.PerspectiveCamera(63,innerWidth/innerHeight,.1,600);camera.position.set(0,5,12);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5f5ff,0x667b47,2.1));const sun=new THREE.DirectionalLight(0xfff2d6,2.6);sun.position.set(-35,60,20);scene.add(sun);
const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const grassMat=mat(0x6c9b55),roadMat=mat(0x3e454b,.96),lineMat=mat(0xf1e8c8),edgeMat=mat(0xd8d7c8),trunkMat=mat(0x70503a),leafMat=mat(0x3e7442),leaf2=mat(0x65934b);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1500,1500),grassMat);ground.rotation.x=-Math.PI/2;ground.position.y=-.18;scene.add(ground);
const roadGroup=new THREE.Group();scene.add(roadGroup);
// Faixa contínua de segurança: mantém a pista visível mesmo durante a reciclagem dos detalhes.
const continuousRoad=new THREE.Mesh(new THREE.PlaneGeometry(roadWidth,100000),roadMat);
continuousRoad.rotation.x=-Math.PI/2;continuousRoad.position.set(0,-.005,-49990);scene.add(continuousRoad);
const segments=[],roadWidth=10,segLen=18,segCount=36;
function makeSegment(i){const g=new THREE.Group();const z=0;g.position.z=-i*segLen;const road=new THREE.Mesh(new THREE.PlaneGeometry(roadWidth,segLen+0.5),roadMat);road.rotation.x=-Math.PI/2;road.position.set(0,0,z);g.add(road);
for(const x of [-roadWidth/2+.12,roadWidth/2-.12]){const e=new THREE.Mesh(new THREE.BoxGeometry(.12,.035,segLen),edgeMat);e.position.set(x,.025,z);g.add(e)}
const dash=new THREE.Mesh(new THREE.BoxGeometry(.13,.035,5),lineMat);dash.position.set(0,.03,z);g.add(dash);
for(const side of [-1,1]){if((i+ (side===1?2:0))%2===0){const tree=makeTree();tree.position.set(side*(10+Math.random()*13),0,(Math.random()-.5)*9);tree.scale.setScalar(.7+Math.random()*.9);g.add(tree)}}
g.userData.baseZ=-i*segLen;roadGroup.add(g);segments.push(g)}
function makeTree(){const g=new THREE.Group();const t=new THREE.Mesh(new THREE.CylinderGeometry(.13,.22,1.8,6),trunkMat);t.position.y=.9;g.add(t);const a=new THREE.Mesh(new THREE.ConeGeometry(1.05,2.6,7),leafMat);a.position.y=2.45;g.add(a);const b=new THREE.Mesh(new THREE.ConeGeometry(.75,1.8,7),leaf2);b.position.y=3.25;g.add(b);return g}
for(let i=0;i<segCount;i++)makeSegment(i);
const hills=[];for(let i=0;i<18;i++){const h=new THREE.Mesh(new THREE.SphereGeometry(1,12,8),mat(i%2?0x7da66a:0x8caf72));h.scale.set(18+Math.random()*28,5+Math.random()*12,14+Math.random()*20);h.position.set((Math.random()<.5?-1:1)*(35+Math.random()*80),h.scale.y-1,-i*38-25);scene.add(h);hills.push(h)}
const car=new THREE.Group();scene.add(car);
let paintM=mat(0x2878d0,.25,.35);let carBody;
function clearCar(){while(car.children.length)car.remove(car.children[0])}
function buildCar(color){clearCar();paintM=mat(color,.23,.42);const body=new THREE.Mesh(new THREE.BoxGeometry(1.8,.52,3.7),paintM);body.position.y=.78;car.add(body);const hood=new THREE.Mesh(new THREE.BoxGeometry(1.72,.22,1.1),paintM);hood.position.set(0,.96,-1.12);car.add(hood);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.35,.68,1.65),mat(0x203544,.18,.15));cabin.position.set(0,1.28,.25);car.add(cabin);const roof=new THREE.Mesh(new THREE.BoxGeometry(1.2,.08,1.2),paintM);roof.position.set(0,1.65,.25);car.add(roof);const lamp=mat(0xfff0bd,.2),tail=mat(0xe63e32,.25);for(const x of [-.62,.62]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.22,16),mat(0x151719,.8));w.rotation.z=Math.PI/2;w.position.set(x,.43,-1.1);car.add(w);const w2=w.clone();w2.position.z=1.15;car.add(w2);const f=new THREE.Mesh(new THREE.BoxGeometry(.28,.12,.06),lamp);f.position.set(x,.8,-1.88);car.add(f);const t=new THREE.Mesh(new THREE.BoxGeometry(.28,.13,.06),tail);t.position.set(x,.8,1.88);car.add(t)}car.position.set(0,0,4)}
const colors=[0x2878d0,0xc83e38,0xe3e5e7,0x20242a,0x3e8050,0xd4a52f,0x7a55ad,0x17a2a0,0xf0f0eb,0x8d4d31];let carIndex=0;buildCar(colors[0]);
const keys={};let steer=0,speed=72,distance=0,paused=false,gasTouch=false,leftTouch=false,rightTouch=false,elapsed=0;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function hold(id,setter){const el=document.getElementById(id);const on=v=>e=>{e.preventDefault();setter(v)};el.addEventListener('pointerdown',on(true));['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,on(false)))}
hold('left',v=>leftTouch=v);hold('right',v=>rightTouch=v);hold('gas',v=>gasTouch=v);
document.getElementById('change').onclick=()=>{carIndex=(carIndex+1)%1000;const color=colors[carIndex%colors.length];buildCar(color);hint.textContent='Modelo '+(carIndex+1)+' de 1000 · combinação visual selecionada';setTimeout(()=>hint.textContent='WASD / setas para dirigir · Espaço para frear · R para reiniciar',2200)};
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'Continuar':'Pausar'};
function reset(){speed=72;distance=0;steer=0;car.position.x=0;hint.textContent='Viagem reiniciada';}
let roadOffset=0;let last=performance.now();function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-last)/1000,.04);last=now;if(!paused){elapsed+=dt;const forward=keys.w||keys.arrowup||gasTouch,brake=keys.s||keys.arrowdown||keys[' '];speed+= (forward?17:0)*dt;speed-= (brake?35:0)*dt;speed-=(!forward&&!brake?1.5:0)*dt;speed=THREE.MathUtils.clamp(speed,0,190);const l=keys.a||keys.arrowleft||leftTouch,r=keys.d||keys.arrowright||rightTouch;const target=(r?1:0)-(l?1:0);steer=THREE.MathUtils.damp(steer,target,3.4,dt);car.position.x=THREE.MathUtils.clamp(car.position.x+steer*speed*.018*dt,-4.1,4.1);car.rotation.z=-steer*.055;car.rotation.y=-steer*.04;const travel=speed/3.6*dt;distance+=travel/1000;const advance=travel*1.8;const roadLoop=segLen*segCount;roadOffset=(roadOffset+advance)%roadLoop;for(let i=0;i<segments.length;i++){let z=-i*segLen+roadOffset;if(z>segLen)z-=roadLoop;segments[i].position.z=z;}for(const h of hills){h.position.z+=advance*.45;if(h.position.z>35)h.position.z-=18*38;}camera.position.x=THREE.MathUtils.damp(camera.position.x,car.position.x*.42,2.5,dt);camera.position.y=5+Math.sin(elapsed*1.7)*.025;camera.position.z=12;camera.lookAt(car.position.x*.45,.8,-12);speedEl.textContent=Math.round(speed);distEl.textContent=distance.toFixed(1)}renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});requestAnimationFrame(animate);
})();
</script>
</body></html>
